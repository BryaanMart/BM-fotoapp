<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BM PRODUCCIONES · CRM</title>
<style>
:root{--bg:#0d0d10;--sf:#16161a;--sf2:#1e1e24;--ln:#2a2a31;--tx:#ececf1;--mt:#8d8d98;--ac:#e6e6ec;color-scheme:dark;
/* Tokens del tema (valores del modo oscuro = diseño original) */
--on-ac:#0d0d10;--ac-h:#e6e6ec;--nav-bg:var(--ac);--nav-tx:var(--on-ac);--hl:#f97316;--on-hl:#0d0d10;
--ln2:#44444d;--ln3:#3a3a44;--inp:#101014;--trk:#101014;--tp:rgba(13,13,16,.9);--ov:rgba(0,0,0,.65);
--sh:0 4px 18px rgba(0,0,0,.25);--shm:0 30px 80px rgba(0,0,0,.6);--chip:rgba(255,255,255,.07);--chip2:rgba(255,255,255,.14);
--busy-bg:rgba(249,115,22,.42);--busy-bd:#f97316;--busy-tx:#fff;--busy-ch:rgba(0,0,0,.35);--busy-lg:rgba(249,115,22,.35);
--bm:100%;--bt:#000;--font:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;--rc:12px;--rb:9px;--ri:8px;--rm:14px}
*{box-sizing:border-box;margin:0}
body{font:14px/1.45 var(--font);background:var(--bg);color:var(--tx)}
button,input,select,textarea{font:inherit;color:inherit}
svg{flex:none}
#app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
#sb{background:var(--sf);border-right:1px solid var(--ln);padding:20px 12px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}
.lg{font-size:12px;letter-spacing:.14em;padding:0 10px;color:var(--mt)}.lg b{display:block;font-size:17px;letter-spacing:.06em;color:var(--tx)}
#nv{display:grid;gap:3px}
#nv button{display:flex;gap:11px;align-items:center;border:0;background:none;padding:10px 12px;border-radius:var(--rb);cursor:pointer;color:var(--mt);text-align:left}
#nv button:hover{background:var(--sf2);color:var(--tx)}#nv button.on{background:var(--nav-bg);color:var(--nav-tx);font-weight:600}
.warn{margin-top:auto;font-size:12px;color:var(--mt);padding:10px;border:1px solid var(--ln);border-radius:var(--rb)}
main{min-width:0}
.tp{display:flex;align-items:center;gap:12px;padding:16px 28px;border-bottom:1px solid var(--ln);position:sticky;top:0;background:var(--tp);backdrop-filter:blur(10px);z-index:5}
.tp h1{font-size:20px;font-weight:600;flex:1}#st{font-size:12px;color:var(--mt)}
#vw{padding:24px 28px 60px}
.bt{display:inline-flex;gap:7px;align-items:center;border:1px solid var(--ln);background:var(--sf2);padding:8px 14px;border-radius:var(--rb);cursor:pointer;white-space:nowrap}
.bt:hover{border-color:var(--ln2)}.bt.p{background:var(--ac);color:var(--on-ac);border-color:var(--ac);font-weight:600}.bt.d:hover{color:#ef4444;border-color:#ef4444}
.ib{display:none;border:0;background:none;cursor:pointer;padding:4px}
.gr{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:20px}
.cd{background:var(--sf);border:1px solid var(--ln);border-radius:var(--rc);padding:16px 18px;box-shadow:var(--sh)}
.cd small,.mt{color:var(--mt)}.cd .n{font-size:26px;font-weight:600;letter-spacing:-.02em;margin-top:2px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;margin-bottom:14px}
h4{font-size:13px;font-weight:600;margin-bottom:10px;color:var(--mt)}
.ls{display:grid;gap:2px}.li{display:flex;justify-content:space-between;gap:10px;padding:8px 4px;border-bottom:1px solid var(--ln);cursor:pointer}.li:last-child{border:0}.li:hover{background:var(--sf2)}.li span{min-width:0}.li small{display:block;color:var(--mt)}
.empty{color:var(--mt);padding:16px 4px}
.bars{display:flex;align-items:flex-end;gap:8px;height:130px}.bc{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px;min-width:0}.bc i{width:100%;max-width:34px;border-radius:5px 5px 0 0;min-height:2px;background:var(--ac)}.bc small{font-size:10px;color:var(--mt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--ln);vertical-align:middle}th{font-size:12px;color:var(--mt);font-weight:600}tr.k{cursor:pointer}tr.k:hover td{background:var(--sf2)}
.tl{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
input,select,textarea{background:var(--inp);border:1px solid var(--ln);border-radius:var(--ri);padding:9px 11px;width:100%;outline:0}input:focus,select:focus,textarea:focus{border-color:var(--ac)}
.tl input,.tl select{width:auto;flex:1;min-width:150px}
.badge{display:inline-flex;gap:6px;align-items:center;font-size:12px;padding:3px 9px;border-radius:20px;border:1px solid var(--c);color:color-mix(in srgb,var(--c) var(--bm),var(--bt))}
.seg{display:inline-flex;background:var(--sf);border:1px solid var(--ln);border-radius:var(--rb);padding:3px}.seg button{border:0;background:none;padding:6px 14px;border-radius:7px;cursor:pointer;color:var(--mt)}.seg button.on{background:var(--ac);color:var(--on-ac);font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.dh{font-size:12px;color:var(--mt);text-align:center;padding:4px}
.dc{min-height:104px;background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:6px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0}.dc:hover{border-color:var(--ln2)}.dc.x{background:none;border:0;cursor:default}.dc.busy{background:var(--sf2);border-color:var(--ln3)}.dc.td b{background:var(--ac);color:var(--on-ac);border-radius:10px;padding:0 7px}.dc b{font-weight:600;align-self:flex-start;font-size:12px}
.ch{border:0;border-left:3px solid var(--c);background:var(--chip);border-radius:5px;padding:2px 6px;text-align:left;font-size:12px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ch:hover{background:var(--chip2)}
.lgd{display:flex;gap:16px;color:var(--mt);font-size:12px;margin-top:12px}.lgd i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--sf2);border:1px solid var(--ln3)}
.kb{display:grid;grid-template-columns:repeat(6,minmax(210px,1fr));gap:12px;overflow-x:auto;padding-bottom:10px}
.col{background:var(--sf);border:1px solid var(--ln);border-radius:var(--rc);padding:12px;min-height:300px;display:flex;flex-direction:column;gap:9px}.col.ov{border-color:var(--ac)}
.col h4{display:flex;gap:7px;align-items:center;color:color-mix(in srgb,var(--c) var(--bm),var(--bt));margin:0}.col h4 em{margin-left:auto;font-style:normal;color:var(--mt)}
.kc{background:var(--sf2);border:1px solid var(--ln);border-left:3px solid var(--c);border-radius:var(--rb);padding:10px;display:grid;gap:4px;cursor:grab}.kc:hover{border-color:var(--ln2)}.kc small{color:var(--mt)}.kc select{padding:5px 8px;margin-top:4px}
#mo{position:fixed;inset:0;background:var(--ov);display:none;align-items:flex-start;justify-content:center;padding:4vh 14px;overflow:auto;z-index:20}
.md{background:var(--sf);border:1px solid var(--ln);border-radius:var(--rm);width:min(720px,100%);box-shadow:var(--shm)}
.mh{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--ln)}.mh h3{font-size:16px}
.mbd{padding:18px 20px 22px}.mbd h4{margin:22px 0 10px}
.fm{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fm label,.w2{display:grid;gap:5px;color:var(--mt);font-size:12px}.w2{grid-column:1/3}.rw{display:flex;gap:10px;justify-content:flex-end;align-items:center}
.ml{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr)) auto;gap:8px;align-items:end;margin-top:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--ln)}.row select{width:auto}
#ts{position:fixed;bottom:22px;left:50%;transform:translate(-50%,16px);background:var(--ac);color:var(--on-ac);padding:10px 18px;border-radius:24px;opacity:0;transition:.25s;pointer-events:none;z-index:40;font-weight:500}#ts.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:860px){#app{grid-template-columns:1fr}#sb{position:fixed;z-index:15;left:0;width:240px;transform:translateX(-100%);transition:.25s}#sb.open{transform:none}.ib{display:block}.tp,#vw{padding-left:16px;padding-right:16px}.fm{grid-template-columns:1fr}.w2{grid-column:1}.cal{gap:3px}.dc{min-height:70px;padding:3px}.ch{font-size:10px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.dc.busy{background:rgba(249,115,22,.2);border-color:#f97316}.dc.busy .ch{background:rgba(249,115,22,.3)}.lgd i.or{background:var(--busy-lg);border-color:var(--busy-bd)}
.pb{height:8px;background:var(--trk);border:1px solid var(--ln);border-radius:6px;overflow:hidden}.pb i{display:block;height:100%;transition:width .4s}.pl{display:flex;justify-content:space-between;font-size:12px;color:var(--mt);margin:10px 0 4px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:20px}.tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 10px;background:var(--sf);border:1px solid var(--ln);border-radius:var(--rc);cursor:pointer;position:relative}.tile:hover{border-color:var(--hl)}.tile svg{width:30px;height:30px}.tile .lk{position:absolute;top:8px;right:8px;color:var(--mt)}
#lgo{cursor:pointer}#lgo img{max-width:100%;max-height:64px;display:block}
#mdb{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;border:1px solid var(--ln);border-radius:var(--rb);padding:8px 10px}
.dc.busy{background:var(--busy-bg);border-color:var(--busy-bd);box-shadow:inset 0 0 0 1px var(--busy-bd)}.dc.busy b{color:var(--busy-tx)}.dc.busy .ch{background:var(--busy-ch)}
#nv button svg,.tile svg{color:color-mix(in srgb,var(--ic) var(--bm),var(--bt))}.tile{background:color-mix(in srgb,var(--ic) 14%,var(--sf));border-color:color-mix(in srgb,var(--ic) 40%,var(--ln))}
.tps{display:flex;gap:8px;flex-wrap:wrap}.fm .tps label{display:block;position:relative;color:var(--tx);font-size:14px}.tps input{position:absolute;opacity:0;width:0;height:0}.tps span{display:block;padding:9px 20px;border:1px solid var(--ln);border-radius:22px;cursor:pointer;background:var(--sf2)}.tps input:checked+span{background:var(--hl);border-color:var(--hl);color:var(--on-hl);font-weight:600}
.hb{display:grid;grid-template-columns:minmax(80px,150px) 1fr 118px;gap:10px;align-items:center;margin:7px 0;font-size:12px}.hb>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hb .tr{height:12px;background:var(--trk);border:1px solid var(--ln);border-radius:7px;overflow:hidden}.hb .tr i{display:block;height:100%;border-radius:7px;transition:width .4s}.hb:hover .tr{border-color:var(--ln2)}
#gr{position:absolute;top:110%;right:0;width:300px;background:var(--sf);border:1px solid var(--ln);border-radius:10px;z-index:30;display:none}#gr .li{padding:8px 12px}#gsw{position:relative}#gs{width:220px}.tp{flex-wrap:wrap}.tp h1{white-space:nowrap}@media(max-width:860px){.tp{gap:8px 10px;padding-top:12px;padding-bottom:12px}.tp h1{font-size:17px}#st{display:none}#gsw{order:5;flex:1 1 100%}#gs{width:100%}#gr{width:100%}}

/* ====== Personalización de apariencia: selector, tema claro y tema Tesla ====== */
.ngl{padding:14px 12px 4px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mt)}
.thm{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:14px 0}
.th{display:flex;flex-direction:column;align-items:stretch;gap:6px;text-align:left;padding:10px 10px 12px;border:1px solid var(--ln);border-radius:var(--rc);background:var(--sf);cursor:pointer}
.th:hover{border-color:var(--ln2)}.th.on{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}.th b{margin-top:4px}.th small{color:var(--mt)}
.pv{display:grid;grid-template-columns:30% 1fr;height:92px;border:1px solid var(--pc);border-radius:8px;overflow:hidden;background:var(--pa)}
.pv i{display:block}.pv .s{display:grid;align-content:start;gap:5px;padding:9px 7px;background:var(--pb);border-right:1px solid var(--pc)}
.pv .s i{height:5px;border-radius:3px;background:var(--pc)}.pv .s i:first-child{background:var(--px);width:70%}
.pv .m{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:9px;align-content:start}
.pv .m i{height:26px;border-radius:5px;background:var(--pb);border:1px solid var(--pc)}
.pv .m i.w{grid-column:1/3;height:6px;width:45%;background:var(--px);border:0}.pv .m i.k{grid-column:1/3;height:8px;width:30%;background:var(--pk);border:0}
.pv.dark{--pa:#0d0d10;--pb:#16161a;--pc:#2a2a31;--px:#ececf1;--pk:#e6e6ec}
.pv.light{--pa:#f4f5f7;--pb:#ffffff;--pc:#e3e6eb;--px:#16181d;--pk:#18181b}
.pv.tesla{--pa:#ffffff;--pb:#ffffff;--pc:#e4e4e4;--px:#171a20;--pk:#3e6ae1}

/* ---------- MODO CLARO ---------- */
:root[data-theme="light"]{color-scheme:light;
--bg:#f4f5f7;--sf:#ffffff;--sf2:#f1f3f6;--ln:#e3e6eb;--tx:#16181d;--mt:#667085;--ac:#18181b;--on-ac:#ffffff;--ac-h:#34343b;
--nav-bg:#18181b;--nav-tx:#ffffff;--hl:#f97316;--on-hl:#0d0d10;--ln2:#c4c9d2;--ln3:#d5d9e0;--inp:#ffffff;--trk:#eceef2;
--tp:rgba(244,245,247,.88);--ov:rgba(16,24,40,.45);--sh:0 1px 2px rgba(16,24,40,.05),0 6px 18px rgba(16,24,40,.06);--shm:0 24px 70px rgba(16,24,40,.25);
--chip:rgba(16,24,40,.06);--chip2:rgba(16,24,40,.11);--busy-bg:rgba(249,115,22,.16);--busy-bd:#f97316;--busy-tx:#9a3412;--busy-ch:rgba(255,255,255,.85);--busy-lg:rgba(249,115,22,.22);--bm:70%;--bt:#000}
html[data-theme="light"] .bt{background:#fff}
html[data-theme="light"] .bt:hover{background:var(--sf2)}
html[data-theme="light"] .bt.p{background:var(--ac);border-color:var(--ac);color:var(--on-ac)}
html[data-theme="light"] .bt.p:hover{background:var(--ac-h);border-color:var(--ac-h)}
html[data-theme="light"] .bt.d:hover{background:#fff}
html[data-theme="light"] input:focus,html[data-theme="light"] select:focus,html[data-theme="light"] textarea:focus{box-shadow:0 0 0 3px rgba(24,24,27,.08)}
html[data-theme="light"] ::placeholder,html[data-theme="tesla"] ::placeholder{color:var(--mt);opacity:.65}
html[data-theme="light"] .dc.busy .ch{border-left-color:var(--c)}

/* ---------- MODO TESLA (claro, minimalista y amplio) ---------- */
:root[data-theme="tesla"]{color-scheme:light;
--font:"Inter","Helvetica Neue","Segoe UI",Arial,system-ui,sans-serif;
--bg:#ffffff;--sf:#ffffff;--sf2:#f4f4f4;--ln:#e6e6e6;--tx:#171a20;--mt:#5c5e62;--ac:#3e6ae1;--on-ac:#ffffff;--ac-h:#3457b1;
--nav-bg:#f4f4f4;--nav-tx:#171a20;--hl:#3e6ae1;--on-hl:#ffffff;--ln2:#c9cacc;--ln3:#d0d1d2;--inp:#ffffff;--trk:#eeeeee;
--tp:rgba(255,255,255,.92);--ov:rgba(23,26,32,.42);--sh:none;--shm:0 24px 64px rgba(23,26,32,.2);
--chip:rgba(23,26,32,.05);--chip2:rgba(23,26,32,.09);--busy-bg:rgba(62,106,225,.09);--busy-bd:#3e6ae1;--busy-tx:#171a20;--busy-ch:#ffffff;--busy-lg:rgba(62,106,225,.14);--bm:76%;--bt:#000;
--rc:6px;--rb:4px;--ri:4px;--rm:8px}
html[data-theme="tesla"] body{-webkit-font-smoothing:antialiased;letter-spacing:.005em}
html[data-theme="tesla"] #sb{padding:28px 14px;gap:24px}
html[data-theme="tesla"] .lg b{font-weight:500;letter-spacing:.14em;font-size:15px}
html[data-theme="tesla"] #nv button{padding:11px 14px;font-weight:500;transition:background .15s,color .15s}
html[data-theme="tesla"] #nv button.on{font-weight:500;box-shadow:inset 2px 0 0 var(--ac)}
html[data-theme="tesla"] #nv button svg,html[data-theme="tesla"] .tile svg{color:currentColor}
html[data-theme="tesla"] .tp h1{font-size:20px;font-weight:500;letter-spacing:.01em}
html[data-theme="tesla"] .gr,html[data-theme="tesla"] .g2,html[data-theme="tesla"] .tiles{gap:20px}
html[data-theme="tesla"] .cd{padding:22px 24px}
html[data-theme="tesla"] .cd .n{font-weight:500;font-size:28px;letter-spacing:-.01em}
html[data-theme="tesla"] h4{font-weight:500;letter-spacing:.02em}
html[data-theme="tesla"] .tile{background:var(--sf);border-color:var(--ln);padding:24px 10px}
html[data-theme="tesla"] .tile:hover{background:var(--sf2)}
html[data-theme="tesla"] .bt{font-weight:500;padding:9px 18px;background:#fff;border-color:var(--ln3)}
html[data-theme="tesla"] .bt:hover{background:var(--sf2)}
html[data-theme="tesla"] .bt.p{background:var(--ac);border-color:var(--ac);color:var(--on-ac)}
html[data-theme="tesla"] .bt.p:hover{background:var(--ac-h);border-color:var(--ac-h)}
html[data-theme="tesla"] .bt.d:hover{background:#fff;color:#ef4444;border-color:#ef4444}
html[data-theme="tesla"] input:focus,html[data-theme="tesla"] select:focus,html[data-theme="tesla"] textarea:focus{box-shadow:0 0 0 3px rgba(62,106,225,.15)}
html[data-theme="tesla"] input,html[data-theme="tesla"] select,html[data-theme="tesla"] textarea{border-color:var(--ln3)}
html[data-theme="tesla"] th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:500}
html[data-theme="tesla"] th,html[data-theme="tesla"] td{padding:14px 10px}
html[data-theme="tesla"] .badge{border-radius:4px;font-weight:500}
html[data-theme="tesla"] .tps span{border-radius:4px;padding:9px 18px}
html[data-theme="tesla"] .seg{border-radius:4px;background:var(--sf2);border-color:transparent}
html[data-theme="tesla"] .seg button{border-radius:3px}
html[data-theme="tesla"] .seg button.on{background:#fff;color:var(--tx);font-weight:500;box-shadow:0 1px 2px rgba(23,26,32,.14)}
html[data-theme="tesla"] .dc{border-radius:4px;min-height:112px;padding:8px}
html[data-theme="tesla"] .dc.td b{border-radius:4px}
html[data-theme="tesla"] .ch,html[data-theme="tesla"] .pb,html[data-theme="tesla"] .hb .tr,html[data-theme="tesla"] .pb i,html[data-theme="tesla"] .hb .tr i{border-radius:3px}
html[data-theme="tesla"] .kc{border-radius:4px}
html[data-theme="tesla"] .mh{padding:20px 28px}
html[data-theme="tesla"] .mbd{padding:24px 28px 28px}
html[data-theme="tesla"] #ts{border-radius:4px}
@media(min-width:861px){html[data-theme="tesla"] #vw{padding:36px 44px 80px}html[data-theme="tesla"] .tp{padding:20px 44px}}

/* Logo claro (pensado para fondo oscuro): se muestra sobre una placa oscura en los temas claros */
html[data-theme="light"][data-logo="light"] #lgo img,html[data-theme="tesla"][data-logo="light"] #lgo img{background:#16161a;padding:10px 12px;border-radius:10px}
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d0d10">
<script>/* Aplica el tema guardado antes de pintar (evita parpadeo) */try{var _t=localStorage.getItem('bm-theme'),_c={dark:'#0d0d10',light:'#f4f5f7',tesla:'#ffffff'};if(_t==='dark'||_t==='light'||_t==='tesla'){document.documentElement.setAttribute('data-theme',_t);document.querySelector('meta[name="theme-color"]').setAttribute('content',_c[_t])}}catch(e){}</script>
